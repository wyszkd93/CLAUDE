<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xmas Tree</title>
<style>
  :root {
    --bg: #05070d;
    --ink: #aab4c0;
    --ink-dim: #6c7684;
    --accent: #f1c453;
    --panel: rgba(12, 16, 26, .82);
    --line: rgba(255, 255, 255, .12);
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink);
    font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; }
  /* 정적 레이어는 한 번만 그리고 브라우저가 합성한다(프레임마다 전체 화면을 다시 그리지 않는다) */
  #glow { position: fixed; pointer-events: none; opacity: 0; mix-blend-mode: screen;
    background: radial-gradient(closest-side, rgba(255,205,110,.55), rgba(255,170,70,.16) 50%, rgba(255,150,50,0)); }
  #ui { z-index: 2; position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #panel { display: none; width: min(300px, calc(100vw - 24px)); box-sizing: border-box; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--panel); backdrop-filter: blur(6px); }
  #ui.open #panel { display: block; }
  #panel label { display: grid; grid-template-columns: 74px 1fr 52px; gap: 8px; align-items: center; margin: 6px 0; color: var(--ink-dim); }
  #panel label.text { grid-template-columns: 74px 1fr; }
  #panel output { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  #panel select { width: 100%; box-sizing: border-box; padding: 5px 8px; color: var(--ink); background: #10151f; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #panel input[type=text] { width: 100%; box-sizing: border-box; padding: 5px 8px; color: var(--ink); background: rgba(255,255,255,.06);
    border: 1px solid var(--line); border-radius: 6px; font: inherit; }
  #panel input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.14); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel .hint { margin: 8px 0 0; color: var(--ink-dim); font-size: 12px; }
  #gear { width: 36px; height: 36px; padding: 0; font-size: 18px; line-height: 1; border-radius: 50%; opacity: .6; }
  #gear:hover, #ui.open #gear { opacity: 1; }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="glow" aria-hidden="true"></div>
<canvas id="c" aria-label="회전하는 크리스마스 트리 애니메이션" role="img"></canvas>
<div id="ui">
  <div id="panel" role="group" aria-label="설정">
    <label class="text"><span>글자</span><input id="in-text" type="text" maxlength="40" value="MERRY CHRISTMAS" spellcheck="false"></label>
    <label><span>글자 수</span><input id="in-letters" type="range" min="2000" max="20000" step="500" value="8500"><output id="out-letters"></output></label>
    <label><span>전구</span><input id="in-lights" type="range" min="0" max="400" step="10" value="170"><output id="out-lights"></output></label>
    <label><span>회전 속도</span><input id="in-spin" type="range" min="-60" max="90" step="1" value="15"><output id="out-spin"></output></label>
    <label class="text"><span>품질</span><select id="in-quality" aria-label="그리기 품질"><option value="auto">자동(느리면 낮춤)</option><option value="0">0 최고</option><option value="1">1 높음</option><option value="2">2 보통</option><option value="3">3 낮음</option><option value="4">4 최저</option></select></label>
    <div class="row"><button id="btn-replay" type="button">처음부터</button><button id="btn-pause" type="button">일시정지</button></div>
    <p class="hint">Space 일시정지 · R 처음부터 · H HUD · F 전체화면</p>
  </div>
  <button id="gear" type="button" aria-label="설정 열기/닫기" aria-expanded="false">&#9881;</button>
</div>

<script>
/* ---------------------------------------------------------------------------
 * 회전하는 크리스마스 트리 (Canvas 2D, 외부 의존성 없음)
 *
 * 나무는 층(tier)마다 가지(branch)를 방사형으로 뻗고, 가지마다 글자 수천 개를 뿌려 만든다.
 * 줄기에서 바깥으로 자라고, 다 자라면 황금 줄·장식 공·전구·별이 붙는다.
 * 3D 회전 → 원근 투영 → 깊이 정렬(계수 정렬, O(n)) → 스프라이트 그리기.
 * 글자는 미리 만든 스프라이트(글자 × 색조 × 밝기)를 drawImage 로 찍어 프레임당 비용을 낮춘다.
 *
 * window.XmasTree.core : 순수 계산 함수(테스트용).  window.XmasTree.app : 화면.
 * ------------------------------------------------------------------------- */
(function () {
  'use strict';

  const TAU = Math.PI * 2;
  const CFG = Object.freeze({
    tiers: 9, radius: 0.85, top: 1.0, bottom: -0.45, trunkBottom: -1.1,
    droop: 0.42, camera: 4.5, grow: 10, initial: 453, golden: 0.618,
    lightStart: 6, lightInterval: 0.04, bucketCount: 96, depthRange: 1.4,
  });
  const ORNAMENT_RGB = [[225, 45, 55], [240, 190, 60], [90, 140, 235], [225, 225, 235]];
  const LIGHT_RGB = [[255, 235, 170], [255, 200, 90], [255, 90, 90], [120, 170, 255], [255, 255, 255]];
  const LEVELS = 12;       // 글자 밝기 단계 수
  const HUES = 3;          // 0 기본, 1 따뜻함(가지 끝), 2 차가움

  // ---- 수학/난수 ------------------------------------------------------------
  function mulberry32(seed) {
    let a = seed | 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function makeRng(seed) {
    const r = mulberry32(seed);
    return {
      next: r,
      uniform: (a, b) => a + (b - a) * r(),
      int: (n) => Math.floor(r() * n),
      normal() { let u = 0; while (u === 0) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * r()); },
    };
  }
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  function smoothstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }

  /** total 을 weights 비율로 나눠 합이 정확히 total, 각 몫은 1 이상이 되게 한다(최대 잔여법). */
  function allocate(total, weights) {
    const n = weights.length;
    if (total < n) throw new RangeError('글자 수(' + total + ')가 가지 수(' + n + ')보다 적을 수 없음');
    let sum = 0; for (const w of weights) sum += w;
    const out = new Array(n), frac = new Array(n);
    let used = 0;
    for (let i = 0; i < n; i++) {
      const share = weights[i] / sum * (total - n);
      out[i] = Math.floor(share); frac[i] = share - out[i]; used += out[i];
    }
    let rest = total - n - used;
    const idx = Array.from({ length: n }, (_, i) => i).sort((a, b) => (frac[b] - frac[a]) || (a - b));
    for (let k = 0; rest > 0; k++, rest--) out[idx[k]] += 1;
    return out.map((v) => v + 1);
  }

  /** 층의 (높이, 꼭대기로부터의 비율 0..1, 가지 수). 아래층일수록 가지가 많다. */
  function tierLayout() {
    const T = CFG.tiers, y0 = CFG.top - 0.12, y1 = CFG.bottom + 0.05;
    const ys = [], frac = [], perTier = [];
    for (let i = 0; i < T; i++) {
      const y = y0 + (y1 - y0) * (i / (T - 1));
      const f = (CFG.top - y) / (CFG.top - CFG.bottom);
      ys.push(y); frac.push(f); perTier.push(Math.floor(6 + 10 * f));
    }
    return { ys, frac, perTier };
  }
  const MIN_LETTERS = tierLayout().perTier.reduce((a, b) => a + b, 0);

  /** keys 를 0..B-1 칸으로 나눠 오름차순으로 정렬한 인덱스 배열(안정, O(n)). */
  function countingOrder(keys, n, B) {
    const counts = new Int32Array(B + 1);
    for (let i = 0; i < n; i++) counts[keys[i] + 1]++;
    for (let b = 0; b < B; b++) counts[b + 1] += counts[b];
    const order = new Int32Array(n);
    for (let i = 0; i < n; i++) order[counts[keys[i]]++] = i;
    return order;
  }

  /** countingOrder 의 버퍼 재사용 버전(프레임마다 새 배열을 만들지 않는다). order 는 길이 ≥ n, counts 는 길이 ≥ B+1. */
  function countingOrderInto(keys, n, B, order, counts) {
    counts.fill(0, 0, B + 1);
    for (let i = 0; i < n; i++) counts[keys[i] + 1]++;
    for (let b = 0; b < B; b++) counts[b + 1] += counts[b];
    for (let i = 0; i < n; i++) order[counts[keys[i]]++] = i;
    return order;
  }

  // ---- 적응형 품질 --------------------------------------------------------------
  /** 0 이 최고. scale 은 devicePixelRatio 상한, keep 은 그릴 글자 비율, halo 는 번짐 여부. */
  const LADDER = Object.freeze([
    { scale: 2, keep: 1, halo: true, cap: 3 }, { scale: 1.5, keep: 1, halo: true, cap: 3 }, { scale: 1, keep: 0.75, halo: true, cap: 2 },
    { scale: 1, keep: 0.55, halo: false, cap: 1 }, { scale: 0.75, keep: 0.4, halo: false, cap: 1 },
  ]);
  const newQualityCtl = () => ({ level: 0, ema: 1000 / 60, slow: 0, fast: 0, hold: 0, lastChange: -1e9, ups: 0 });
  /**
   * 렌더된 프레임 사이 간격(dtMs)을 보고 품질 단계를 올리거나 내린다. 바뀌면 새 단계를, 아니면 null 을 돌려준다.
   * 느림(약 45fps 미만)이 40프레임 계속되면 한 단계(25fps 미만이면 20프레임 뒤 두 단계) 낮추고, 충분히 빠름(55fps 이상)이 6초 계속되면
   * (마지막 변경 15초 뒤, 최대 2번) 한 단계 올린다. 바뀐 직후 12프레임은 재구성 비용 때문에 재지 않는다.
   */
  function qualityStep(ctl, dtMs, nowMs) {
    if (!(dtMs > 0) || dtMs > 80) return null;                 // 탭 전환·정지 직후의 긴 간격은 무시
    if (ctl.hold > 0) { ctl.hold--; return null; }
    ctl.ema += (dtMs - ctl.ema) * 0.08;
    if (ctl.ema > 22) { ctl.slow++; ctl.fast = 0; } else if (ctl.ema < 18.2) { ctl.fast++; ctl.slow = 0; } else { ctl.slow = 0; ctl.fast = 0; }
    const change = (lv, up) => { ctl.level = lv; ctl.slow = 0; ctl.fast = 0; ctl.hold = 12; ctl.ema = 1000 / 60; ctl.lastChange = nowMs; if (up) ctl.ups++; return lv; };
    const veryslow = ctl.ema > 40;                              // 약 25fps 미만이면 두 단계씩, 더 빨리 내린다
    if (ctl.slow >= (veryslow ? 20 : 40) && ctl.level < LADDER.length - 1) return change(Math.min(LADDER.length - 1, ctl.level + (veryslow ? 2 : 1)), false);
    if (ctl.fast >= 360 && ctl.level > 0 && nowMs - ctl.lastChange > 15000 && ctl.ups < 2) return change(ctl.level - 1, true);
    return null;
  }
  /**
   * 60fps 상한. 120/144Hz 화면에서 쓸데없이 많이 그리지 않게 하되, 60Hz 이하 화면은 매 틱 그린다.
   * 다음 그릴 시각(due)을 period 씩 앞으로 옮기며, 조금 이르게(slack) 도착한 틱도 받아 평균을 맞춘다.
   */
  function frameGate(now, due, period, slack) {
    period = period || 1000 / 60; slack = slack == null ? 3.5 : slack;
    if (!due || now - due > 100) due = now;                    // 처음이거나 오래 멈췄다 오면 다시 맞춘다
    return now >= due - slack ? { render: true, due: due + period } : { render: false, due };
  }

  // ---- 스프라이트 아틀라스 배치 -----------------------------------------------------
  /** 정사각 칸 여러 개(한 변 sizes[i])를 가로 width 의 선반(shelf)에 차례로 배치한다. 칸 사이 pad 칸 여백. */
  function packShelves(sizes, width, pad) {
    pad = pad == null ? 1 : pad;
    const x = new Int32Array(sizes.length), y = new Int32Array(sizes.length);
    let cx = 0, cy = 0, rowH = 0;
    for (let i = 0; i < sizes.length; i++) {
      const s = sizes[i];
      if (s + pad > width) throw new RangeError('칸(' + s + ')이 아틀라스 너비(' + width + ')보다 큼');
      if (cx + s + pad > width) { cx = 0; cy += rowH + pad; rowH = 0; }
      x[i] = cx; y[i] = cy; cx += s + pad; rowH = Math.max(rowH, s);
    }
    return { x, y, height: cy + rowH + pad };
  }
  /** 그릴 크기 S(px)를 가장 가까운 크기 단계 0..nc-1 로. */
  const classIndex = (S, min, step, nc) => { const c = Math.round((S - min) / step); return c < 0 ? 0 : c >= nc ? nc - 1 : c; };
  /** 글자 점마다 고정된 0..1 값(정수 해시). 품질을 낮출 때 같은 점들이 일관되게 빠지게 한다(깜빡임 방지). */
  const stableHash = (i) => (Math.imul(i + 1, 2654435761) >>> 0) / 4294967296;
  const LETTER_PX = 0.052, ORN_PX = 0.1, GARLAND_PX = 0.042, LIGHT_PX = [0.045, 0.075];

  // ---- 월드 -----------------------------------------------------------------
  function buildWorld(opts) {
    const o = Object.assign({ letters: 8500, text: 'MERRY CHRISTMAS', lights: 170, ornaments: 26, seed: 7 }, opts || {});
    const glyphs = Array.from(new Set(Array.from(o.text).filter((c) => c.trim()))).slice(0, 64);
    const pool = Array.from(o.text).filter((c) => c.trim() && glyphs.includes(c));
    if (!pool.length) throw new RangeError('text 에 글자가 하나는 있어야 함');
    if (!(o.letters >= MIN_LETTERS)) throw new RangeError('letters 는 ' + MIN_LETTERS + ' 이상이어야 함');
    const rng = makeRng(o.seed);
    const { ys, frac, perTier } = tierLayout();
    const R = CFG.radius;

    const brTier = [], brAngle = [], brLen = [], brTint = [];
    for (let ti = 0; ti < CFG.tiers; ti++) {
      const tierLen = 0.12 + (R - 0.12) * frac[ti];
      for (let b = 0; b < perTier[ti]; b++) {
        brTier.push(ti);
        brAngle.push(TAU * b / perTier[ti] + ti * CFG.golden * TAU + 0.12 * rng.normal());
        brLen.push(tierLen * rng.uniform(0.85, 1.08));
        brTint.push(rng.uniform(0.9, 1.0));
      }
    }
    const counts = allocate(o.letters, brLen);
    const N = o.letters;
    const fx = new Float32Array(N), fy = new Float32Array(N), fz = new Float32Array(N);
    const fs = new Float32Array(N), flight = new Float32Array(N), keys = new Float32Array(N);
    const fhash = Float32Array.from({ length: N }, (_, i) => stableHash(i));
    const fglint = new Uint8Array(N), fchar = new Uint8Array(N), fhue = new Uint8Array(N), ftier = new Uint8Array(N);
    let p = 0;
    for (let b = 0; b < brLen.length; b++) {
      const a = brAngle[b], L = brLen[b], ti = brTier[b];
      for (let c = 0; c < counts[b]; c++, p++) {
        const s = Math.pow(rng.next(), 0.65);                       // 가지 따라 위치(끝쪽에 몰림)
        const rad = s * L;
        const spread = (0.03 + 0.10 * s) * rng.normal();            // 가지 옆으로 퍼짐
        const droop = CFG.droop * Math.pow(s, 1.7) * (L / R + 0.35); // 수평으로 뻗다가 끝에서 처짐
        fx[p] = Math.cos(a) * rad - Math.sin(a) * spread;
        fz[p] = Math.sin(a) * rad + Math.cos(a) * spread;
        fy[p] = ys[ti] - droop + 0.025 * rng.normal();
        fs[p] = s; ftier[p] = ti;
        const tint = rng.uniform(0.75, 1.0) * brTint[b];
        flight[p] = tint * (0.30 + 0.70 * Math.pow(s, 0.8));        // 안쪽은 어둡고 끝은 밝다
        fglint[p] = rng.next() < 0.025 ? 1 : 0;                     // 군데군데 반짝이는 잎
        fchar[p] = glyphs.indexOf(pool[rng.int(pool.length)]);
        fhue[p] = s > 0.8 ? (rng.next() < 0.6 ? 1 : 0) : (rng.next() < 0.2 ? 2 : 0);
        keys[p] = 0.75 * s + 0.25 * frac[ti] + 0.03 * rng.normal(); // 자라는 순서 키
      }
    }
    // 자라는 순서: 줄기 가까운 곳·꼭대기부터 바깥·아래로
    const sortedIdx = Array.from({ length: N }, (_, i) => i).sort((a, b) => (keys[a] - keys[b]) || (a - b));
    const order = Uint32Array.from(sortedIdx);
    const sortedKey = Float32Array.from(sortedIdx.map((i) => keys[i]));

    const trunk = [];
    for (let h = 0; h < 18; h++) {
      const y = (CFG.bottom + 0.2) + (CFG.trunkBottom - (CFG.bottom + 0.2)) * (h / 17);
      for (let r = 0; r < 10; r++) trunk.push([0.085 * Math.cos(TAU * r / 10 + h), y, 0.085 * Math.sin(TAU * r / 10 + h)]);
    }

    // 장식 공: 가지 끝, 그 가지가 자란 뒤에 나타난다
    const pickB = Array.from({ length: brLen.length }, (_, i) => i);
    for (let i = pickB.length - 1; i > 0; i--) { const j = rng.int(i + 1); [pickB[i], pickB[j]] = [pickB[j], pickB[i]]; }
    const K = Math.min(Math.max(0, o.ornaments | 0), brLen.length);
    const orn = { x: [], y: [], z: [], color: [], at: [] };
    for (let i = 0; i < K; i++) {
      const b = pickB[i], tipDroop = CFG.droop * (brLen[b] / R + 0.35);
      orn.x.push(Math.cos(brAngle[b]) * brLen[b]); orn.z.push(Math.sin(brAngle[b]) * brLen[b]);
      orn.y.push(ys[brTier[b]] - tipDroop + 0.02);
      orn.color.push(rng.int(ORNAMENT_RGB.length));
      orn.at.push(lowerBound(sortedKey, 0.75 + 0.25 * frac[brTier[b]]));
    }

    // 전구: 잎 위 점 몇 개를 골라 살짝 바깥에 둔다
    const M = Math.min(Math.max(0, o.lights | 0), N);
    const idx = new Uint32Array(N); for (let i = 0; i < N; i++) idx[i] = i;
    const lights = { x: new Float32Array(M), y: new Float32Array(M), z: new Float32Array(M), phase: new Float32Array(M), color: new Uint8Array(M) };
    for (let i = 0; i < M; i++) {
      const j = i + rng.int(N - i); const t = idx[i]; idx[i] = idx[j]; idx[j] = t;
      const q = idx[i];
      lights.x[i] = fx[q] * 1.06; lights.y[i] = fy[q]; lights.z[i] = fz[q] * 1.06;
      lights.phase[i] = rng.uniform(0, TAU); lights.color[i] = rng.int(LIGHT_RGB.length);
    }

    // 황금 전구 줄: 원뿔을 감는 나선(출렁임 포함)
    const G = 700, garland = { u: new Float32Array(G), x: new Float32Array(G), y: new Float32Array(G), z: new Float32Array(G) };
    for (let i = 0; i < G; i++) {
      const u = 0.04 + 0.89 * (i / (G - 1));
      const y = (CFG.top - 0.2) - u * ((CFG.top - 0.2) - (CFG.bottom + 0.12)) + 0.025 * Math.sin(u * TAU * 38);
      const gf = (CFG.top - y) / (CFG.top - CFG.bottom);
      const gr = (0.12 + (R - 0.12) * gf) * 0.95;
      garland.u[i] = u; garland.x[i] = gr * Math.cos(u * TAU * 5); garland.y[i] = y; garland.z[i] = gr * Math.sin(u * TAU * 5);
    }

    return {

      let m = 0;
      if (cap > 0) {
        // 가까운 것부터 보며 화면 칸마다 몇 겹이 찼는지 센다. 이미 cap 겹이 찬 칸의 글자는 가려졌으니 건너뛴다.
        const cell = A.cell, gw = Math.ceil(canvas.width / cell) + 1, gh = Math.ceil(canvas.height / cell) + 1;
        if (buf.grid.length < gw * gh) buf.grid = new Uint8Array(gw * gh);
        const grid = buf.grid, vis = buf.vis, base = A.base.O;
        grid.fill(0, 0, gw * gh);
        for (let q = n - 1; q >= 0; q--) {
          const i = order[q];
          if (SP[i] < base) {                                  // 글자(잎·반짝이는 잎·줄기)만 컬링. 장식·전구·줄은 항상 그린다
            const cx = (X[i] * dpr / cell) | 0, cy = (Y[i] * dpr / cell) | 0;
            if (cx >= 0 && cx < gw && cy >= 0 && cy < gh) { const gi = cy * gw + cx; if (grid[gi] >= cap) continue; grid[gi]++; }
          }
          vis[m++] = i;
        }
        for (let q = m - 1; q >= 0; q--) {                     // 다시 먼 것부터 가까운 순으로 그린다
          const i = vis[q], e = SP[i], s = asz[e];
          ctx.drawImage(img, ax[e], ay[e], s, s, Math.round(X[i] * dpr - s * 0.5), Math.round(Y[i] * dpr - s * 0.5), s, s);
        }
      } else {
        for (let q = 0; q < n; q++) {
          const i = order[q], e = SP[i], s = asz[e];
          ctx.drawImage(img, ax[e], ay[e], s, s, Math.round(X[i] * dpr - s * 0.5), Math.round(Y[i] * dpr - s * 0.5), s, s);
        }
        m = n;
      }
      state.blits = m;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = 'lighter';       // 번짐(가산 혼합): 앞쪽 전구·줄만
      for (let q = 0; q < nh; q += 4) {
        const s = HL[q + 2], c = HL[q + 3];
        ctx.drawImage(c < 0 ? halos.garland : halos.light[c], HL[q] - s / 2, HL[q + 1] - s / 2, s, s);
      }
      drawStar(t, angle);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
      drawSnow(t, w, h);
      ctx.globalAlpha = 1;
      if (state.hud) drawHud(t, angle, vis, lit);
    }

    function drawStar(t, angle) {
      const appear = smoothstep((t - 0.9 * CFG.grow) / 1.0);
      if (appear <= 0) return;
      const view = state.view;
      const [sx, sy] = project(view, 0, CFG.top + 0.03, 0, angle);
      const k = view.focal / CFG.camera, pulse = (0.82 + 0.18 * Math.sin(t * 4)) * appear;
      const gr = ctx.createRadialGradient(sx, sy, 0, sx, sy, 0.34 * k);
      gr.addColorStop(0, 'rgba(255,236,170,' + (0.85 * pulse).toFixed(3) + ')');
      gr.addColorStop(0.25, 'rgba(255,205,100,' + (0.35 * pulse).toFixed(3) + ')');
      gr.addColorStop(1, 'rgba(255,170,60,0)');
      ctx.fillStyle = gr; ctx.fillRect(sx - 0.4 * k, sy - 0.4 * k, 0.8 * k, 0.8 * k);
      ctx.lineCap = 'round';
      for (let i = 0; i < 4; i++) {          // 십자 광선 + 사선 광선
        const ang = i * Math.PI / 4, len = (i % 2 === 0 ? 0.42 : 0.24) * k * (0.9 + 0.1 * Math.sin(t * 3 + i));
        const dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
        const lg = ctx.createLinearGradient(sx - dx, sy - dy, sx + dx, sy + dy);
        lg.addColorStop(0, 'rgba(255,225,130,0)'); lg.addColorStop(0.5, 'rgba(255,240,180,' + (0.9 * pulse).toFixed(3) + ')'); lg.addColorStop(1, 'rgba(255,225,130,0)');
        ctx.strokeStyle = lg; ctx.lineWidth = i % 2 === 0 ? 2 : 1.2;
        ctx.beginPath(); ctx.moveTo(sx - dx, sy - dy); ctx.lineTo(sx + dx, sy + dy); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,244,200,' + pulse.toFixed(3) + ')';
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {          // 5각 별 몸통
        const r = (i % 2 === 0 ? 0.075 : 0.032) * k, ang = -Math.PI / 2 + i * Math.PI / 5;
        ctx[i === 0 ? 'moveTo' : 'lineTo'](sx + Math.cos(ang) * r, sy + Math.sin(ang) * r);
      }
      ctx.closePath(); ctx.fill();
    }

    const fmt = new Intl.NumberFormat('en-US');
    function hudText(t, angle, letters, lit) {
      const mm = String(Math.floor(t / 60)).padStart(2, '0'), ss = String(Math.floor(t % 60)).padStart(2, '0');
      return { top: 't ' + mm + ':' + ss + 's', lines: [
        'rotation ' + angle.toFixed(2).padStart(6, '0') + '°     lights ' + lit,
        'letters ' + fmt.format(letters),
        'running · ' + Math.round(state.fps) + ' fps' + (state.qLevel ? ' · q' + state.qLevel : ''),
      ] };
    }
    function drawHud(t, angle, letters, lit) {
      const { w, h } = state.view, hud = hudText(t, angle, letters, lit);
      ctx.font = '13px ui-monospace, Menlo, Consolas, monospace'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgb(235,90,90)'; ctx.textAlign = 'right'; ctx.fillText(hud.top, w - 16, 26);
      ctx.fillStyle = 'rgb(150,160,172)'; ctx.textAlign = 'left';
      hud.lines.forEach((s, i) => ctx.fillText(s, 16, h - 16 - (hud.lines.length - 1 - i) * 18));
    }

    // ---- 루프: 60fps 상한 + 느리면 품질을 자동으로 낮춘다 ----
    let last = 0, raf = 0, due = 0;
    function frame(now) {
      raf = requestAnimationFrame(frame);
      const gate = frameGate(now, due); due = gate.due;
      if (!gate.render) return;
      const dtMs = last ? now - last : 0; last = now;
      const dt = Math.min(0.1, dtMs / 1000);
      if (dt > 0) state.fps += (1 / dt - state.fps) * 0.05;
      if (!state.paused) state.t += dt;
      draw(state.t);
      if (state.qAuto) {
        const next = qualityStep(ctl, dtMs, now);
        if (next !== null) { state.qLevel = next; applyScale(); }
      }
    }
    function start() { if (!raf) { last = 0; due = 0; raf = requestAnimationFrame(frame); } }
    function stop() { cancelAnimationFrame(raf); raf = 0; }
    /** 루프가 돌지 않을 때(정지·테스트) 크기·설정 변경을 화면에 반영한다. */
    function refresh() { if (!raf && state.world && atlas && twinkle) draw(state.t); }

    resize();
    return {
      state, configure, resize, start, stop, draw, refresh, setQuality, ctl,
      renderAt(t) { state.paused = true; state.t = t; draw(t); },
      setPaused(p) { state.paused = !!p; },
      replay() { state.t = 0; },
      hudText,
      atlasInfo() { return { count: atlas.count, height: atlas.height, ms: state.atlasMs, L: atlas.L, O: atlas.O, Li: atlas.Li, Ga: atlas.Ga }; },
      /** 마지막 프레임에서 그린 순서대로의 깊이 z(테스트용). 먼 것부터 가까운 것 순이어야 한다. */
      drawOrderZ() { return Array.from(state.lastOrder.subarray(0, state.lastItems), (i) => buf.z[i]); },
    };
  }

  // ---- 초기화 ----------------------------------------------------------------
  const api = { core, app: null, createApp };
  window.XmasTree = api;
  const canvas = document.getElementById('c');
  if (!canvas) return;
  const params = new URLSearchParams(location.search);
  const num = (k, d, lo, hi) => { const v = Number(params.get(k)); return params.has(k) && Number.isFinite(v) ? clamp(v, lo, hi) : d; };
  const app = createApp(canvas);
  app.state.spin = num('spin', 15, -360, 360);
  let text = (params.get('text') || 'MERRY CHRISTMAS').slice(0, 40);
  if (!text.trim()) text = 'MERRY CHRISTMAS';
  const letters = Math.max(MIN_LETTERS, Math.round(num('letters', 8500, MIN_LETTERS, 40000)));
  const qp = params.get('quality');
  if (qp !== null && qp !== 'auto') app.setQuality(qp);
  app.configure({ text, letters, lights: Math.round(num('lights', 170, 0, 1000)), seed: Math.round(num('seed', 7, 0, 1e9)) });
  api.app = app;
  let resizeTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => app.resize(), 100); });   // 드래그 중 매번 아틀라스를 다시 만들지 않는다
  if (params.has('paused')) app.setPaused(true); else app.start();   // 정지로 열어도 첫 장면은 configure() 의 refresh() 가 이미 그렸다

  // ---- 컨트롤 ----
  const $ = (id) => document.getElementById(id);
  const ui = $('ui'), gear = $('gear');
  const sync = () => { $('out-letters').textContent = Number($('in-letters').value).toLocaleString('en-US'); $('out-lights').textContent = $('in-lights').value; $('out-spin').textContent = $('in-spin').value + '°/s'; };
  $('in-text').value = text; $('in-letters').value = String(Math.min(20000, Math.max(2000, letters)));
  $('in-lights').value = String(Math.min(400, app.state.world.lightCount)); $('in-spin').value = String(Math.round(app.state.spin));
  sync();
  let timer = 0;
  const rebuild = () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const t = $('in-text').value.trim() ? $('in-text').value : 'MERRY CHRISTMAS';
      app.configure({ text: t, letters: Math.max(MIN_LETTERS, Number($('in-letters').value)), lights: Number($('in-lights').value) });
    }, 150);
  };
  for (const id of ['in-text', 'in-letters', 'in-lights']) $(id).addEventListener('input', () => { sync(); rebuild(); });
  $('in-quality').value = app.state.qAuto ? 'auto' : String(app.state.qLevel);
  $('in-quality').addEventListener('change', () => app.setQuality($('in-quality').value));
  $('in-spin').addEventListener('input', () => { app.state.spin = Number($('in-spin').value); sync(); });
  const showPause = () => { $('btn-pause').textContent = app.state.paused ? '재생' : '일시정지'; };
  const togglePause = () => { app.setPaused(!app.state.paused); if (!app.state.paused) app.start(); showPause(); };
  showPause();
  $('btn-pause').addEventListener('click', togglePause);
  $('btn-replay').addEventListener('click', () => app.replay());
  gear.addEventListener('click', () => { const open = ui.classList.toggle('open'); gear.setAttribute('aria-expanded', String(open)); });
  window.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') app.replay();
    else if (e.key === 'h' || e.key === 'H') app.state.hud = !app.state.hud;
    else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
  });
})();
</script>
</body>
</html>
